<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ферма-экспресс</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e0ecdf;--card:#fff;--ink:#1d2b22;--mute:#5d7064;--line:#c3d6c4;--acc:#2f7d4f;--onacc:#fff;--coin:#e8a912;--bad:#d1493b;--soil:#9a6a46;--soil2:#b5835a;--bar:#d4e2d5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#1a2820;--ink:#e6f0e8;--mute:#93a99a;--line:#2b4034;--acc:#4cae75;--onacc:#0c1710;--coin:#f2c04a;--bad:#ef6f61;--soil:#6e4a31;--soil2:#80583b;--bar:#2b4034}}
:root[data-theme="dark"]{--bg:#101a15;--card:#1a2820;--ink:#e6f0e8;--mute:#93a99a;--line:#2b4034;--acc:#4cae75;--onacc:#0c1710;--coin:#f2c04a;--bad:#ef6f61;--soil:#6e4a31;--soil2:#80583b;--bar:#2b4034}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.35 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
h2{font-size:13px;margin:0 0 6px;color:var(--mute);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px}
.top small{font-size:13px;color:var(--mute);font-weight:500}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#cust{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;min-height:112px}
.c{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.c .r{display:flex;align-items:center;gap:8px}
.face{font-size:28px}
.ord{display:flex;gap:6px;flex-wrap:wrap;font-weight:700}
.ord span{padding:1px 6px;border-radius:8px;background:var(--bar)}
.ord .ok{background:var(--acc);color:var(--onacc)}
.bar{height:6px;border-radius:4px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .1s linear}
.bar i.low{background:var(--bad)}
.give{background:var(--acc);color:var(--onacc);border-radius:10px;padding:6px;font-weight:700}
.give:disabled{background:var(--bar);color:var(--mute);cursor:default}
.empty{grid-column:1/-1;color:var(--mute);text-align:center;padding:30px 0}
#field{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--soil);padding:10px;border-radius:16px}
.p{aspect-ratio:1;border-radius:12px;background:var(--soil2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;position:relative;overflow:hidden}
.p.g{font-size:20px;opacity:.75}
.p.rd{background:var(--acc);animation:pop .7s infinite alternate}
.p .bar{position:absolute;left:8px;right:8px;bottom:7px}
.p small{font-size:12px;color:#fff;opacity:.85}
@keyframes pop{to{transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){.p.rd{animation:none}}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seed{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seed.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.seed b{font-size:22px}.seed small{color:var(--mute);font-size:12px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.buy{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;text-align:left}
.buy:disabled{opacity:.5;cursor:default}
.buy small{display:block;color:var(--mute)}
#msg{min-height:20px;color:var(--mute);text-align:center}
#ov{position:fixed;inset:0;background:rgba(10,20,14,.72);display:flex;align-items:center;justify-content:center;padding:20px}
#ov>div{background:var(--card);border-radius:20px;padding:24px;max-width:360px;text-align:center}
#ov h1{margin:0 0 8px;font-size:26px}
#ov p{color:var(--mute);margin:6px 0}
#ov button{margin-top:14px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:18px;padding:12px 28px;border-radius:14px}
.dn{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 8px;font-size:18px;margin-left:8px}
.lv{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:-6px 0 -6px}
.sb{margin-top:4px}.sb i,#sp{background:var(--coin)}
#field{border:4px solid var(--sc,transparent)}
#ov button.alt{background:var(--bar);color:var(--ink);font-size:15px;padding:8px 20px}
input{font:inherit;-webkit-user-select:text;user-select:text}
#ov>div.wide{max-width:420px;width:100%;max-height:92vh;overflow:auto}
#ov button.chip{margin:0 0 10px;background:var(--bar);color:var(--ink);font-size:15px;padding:6px 14px;border-radius:20px}
#ov .sub{font-weight:700;color:var(--ink)}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
#ov button.av{margin:0;padding:6px;font-size:26px;background:var(--bar);border-radius:12px}
#ov button.av.on{box-shadow:0 0 0 3px var(--acc)}
#nm{width:100%;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;text-align:center}
.st{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;margin:14px 0;color:var(--mute)}
.st b{color:var(--ink)}
.acs{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.ac{padding:6px 8px;border-radius:10px;background:var(--bar);opacity:.55;font-size:13px}
.ac.on{opacity:1;background:var(--acc);color:var(--onacc)}
.tools{display:flex;justify-content:space-between;align-items:center;margin:-4px 0}
.sw{font-variant-numeric:tabular-nums;font-weight:700;color:var(--mute)}
.tools .dn{margin-left:6px;font-size:16px;padding:2px 7px}
.dn.off{opacity:.4}
.nh{font-weight:700;margin:0 0 6px}
.p.g small{opacity:1;font-weight:700}
</style></head><body>
<div id="app">
 <div class="top"><span id="coins"></span><span id="lives"></span></div>
 <div class="tools"><span id="sw" class="sw">⏱ 00:00</span><span><button class="dn" id="bp" data-t="1" data-pause="1" aria-label="Пауза">⏸</button><button class="dn" id="bs" data-t="1" data-snd="1" aria-label="Звук"></button><button class="dn" id="bm" data-t="1" data-mus="1" aria-label="Музыка">🎵</button><button id="dn" class="dn" data-t="1" data-dn="1" aria-label="День или ночь"></button><button class="dn" data-t="1" data-menu="1" aria-label="Главное меню">☰</button></span></div>
 <div class="lv"><span id="lvl"></span><span id="sea"></span></div>
 <div><div class="bar"><i id="xp"></i></div><div class="bar sb"><i id="sp"></i></div></div>
 <section><h2>Клиенты ждут</h2><div id="cust"></div></section>
 <div id="msg"></div>
 <section><h2>Грядки: выбери семена, нажми на пустую грядку, а когда созреет, нажми ещё раз</h2><div id="nh" class="nh"></div><div id="field"></div></section>
 <div class="row" id="seeds"></div>
 <section><h2>Улучшения</h2><div class="shop" id="shop"></div></section>
</div>
<div id="ov"></div>
<script>
const CR={c:{e:'🥕',t:4,p:3},l:{e:'🥬',t:6,p:5},s:{e:'🍓',t:11,p:10},
t:{e:'🍅',t:6,p:6},k:{e:'🌽',t:8,p:7},w:{e:'🍉',t:14,p:15},
m:{e:'🍄',t:5,p:5},a:{e:'🍎',t:9,p:9},g:{e:'🎃',t:12,p:12},
p:{e:'🥔',t:5,p:4},o:{e:'🧅',t:8,p:7},r:{e:'🍊',t:12,p:12}};
const SEA=[{n:'Весна',e:'🌸',col:'#e58fb0',cr:['c','l','s']},{n:'Лето',e:'☀️',col:'#e8a912',cr:['t','k','w']},{n:'Осень',e:'🍂',col:'#d2742a',cr:['m','a','g']},{n:'Зима',e:'❄️',col:'#6fb3e0',cr:['p','o','r']}];
const UNL=3,PER=5;
const FACES=['👩‍🌾','🧑‍🍳','👵','👨‍🦳','🧒','👩‍🦰','🧔','👧'];
const $=id=>document.getElementById(id);
let S,run=false;
const sea=()=>SEA[S.sn%4];
const goal=()=>5+2*S.sn;
const lvl=()=>1+Math.floor(S.served/PER);
const avail=()=>sea().cr.filter((k,i)=>i<2||lvl()>=UNL);
const KEY='farm-express-v1';
let REC={coins:0,lvl:1,seasons:0,orders:0},SV=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){if(d.rec)REC=Object.assign(REC,d.rec);if(d.P)Object.assign(P,d.P);if(typeof d.snd==='boolean')SND=d.snd;if(typeof d.mus==='boolean')MUS=d.mus;if(d.th)document.documentElement.dataset.theme=d.th;if(d.S&&Array.isArray(d.S.plots)&&d.S.inv)SV=d.S}}catch(e){}}
function updRec(){REC.coins=Math.max(REC.coins,S.coins);REC.lvl=Math.max(REC.lvl,lvl());REC.seasons=Math.max(REC.seasons,S.sn);REC.orders=Math.max(REC.orders,S.served)}
function write(s){try{localStorage.setItem(KEY,JSON.stringify({rec:REC,P:P,snd:SND,mus:MUS,th:document.documentElement.dataset.theme||null,S:s}))}catch(e){}}
function save(){if(run){updRec();write(S)}}
let SND=true,MUS=true,AC=null,SG,MG;
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,z=n=>String(n).padStart(2,'0');return (h?h+':':'')+z(m)+':'+z(x)};
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();SG=AC.createGain();SG.gain.value=.8;SG.connect(AC.destination);MG=AC.createGain();MG.gain.value=.6;MG.connect(AC.destination)}catch(e){AC=null;return null}}if(AC.state==='suspended')AC.resume();return AC}
function note(f,at,dur,type,vol,dest){const c=AC;if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.15,t+Math.min(.02,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||SG);o.start(t);o.stop(t+dur+.05)}
const SFX={plant:[[262,0,.1],[330,.06,.12]],harvest:[[523,0,.1],[659,.08,.14]],sell:[[880,0,.08,'triangle'],[1320,.07,.2,'triangle']],buy:[[660,0,.1],[880,.08,.16]],
up:[[523,0,.15,'triangle'],[659,.12,.15,'triangle'],[784,.24,.15,'triangle'],[1047,.36,.4,'triangle']],
season:[[392,0,.5,'sine',.1],[494,.1,.5,'sine',.1],[587,.2,.6,'sine',.1],[784,.3,.9,'sine',.1]],
bad:[[220,0,.25,'sawtooth',.05],[165,.15,.35,'sawtooth',.05]],tap:[[600,0,.04,'sine',.06]],ready:[[784,0,.12,'sine',.08],[988,.1,.18,'sine',.08]]};
function sfx(n){if(!SND||!AC)return;(SFX[n]||[]).forEach(a=>note(a[0],a[1],a[2],a[3],a[4]))}
function setSnd(){$('bs').textContent=SND?'🔊':'🔇';$('bs').classList.toggle('off',!SND);$('bm').classList.toggle('off',!MUS)}
const SCALE=[262,294,330,392,440,523,588],CH=[[131,165,196],[110,131,165],[87,110,131],[98,123,147]];
let mt=0;
setInterval(()=>{if(!MUS||!AC||AC.state!=='running'||document.hidden||(S&&S.paused))return;
 if(mt%4===0)CH[(mt/4)%4].forEach((f,i)=>note(f,i*.12,6,'sine',.035,MG));
 if(Math.random()<.75)note(SCALE[Math.floor(Math.random()*SCALE.length)],0,2.4,'sine',.05,MG);
 mt++},1700);
let P={name:'Фермер',av:'🧑‍🌾',games:0,total:0,time:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AV=['🧑‍🌾','👩‍🌾','👨‍🌾','🧑‍🍳','👵','🧔','👧','🐮'];
const ACH=[['🌱','Первый заказ',()=>P.total>=1],['🛒','10 заказов',()=>P.total>=10],['🏅','Уровень 3',()=>REC.lvl>=3],['🍂','Пройти 2 сезона',()=>REC.seasons>=2],['❄️','Пройти год',()=>REC.seasons>=4],['💰','500 монет за игру',()=>REC.coins>=500],['🔟','Уровень 10',()=>REC.lvl>=10]];
function setAv(v){P.av=v;write(SV);profile()}
function toMenu(){save();SV=S;run=false;menu()}
function profile(){
 const n=ACH.filter(x=>x[2]()).length;
 $('ov').style.display='flex';
 $('ov').innerHTML=`<div class="wide"><h1>Профиль</h1>
 <div class="avs">${AV.map(v=>`<button class="av ${v===P.av?'on':''}" onclick="setAv('${v}')" aria-label="Аватар ${v}">${v}</button>`).join('')}</div>
 <input id="nm" maxlength="14" value="${esc(P.name)}" aria-label="Имя фермера" oninput="P.name=this.value.trim()||'Фермер';write(SV)">
 <div class="st"><span>Игр сыграно</span><b>${P.games}</b><span>Заказов за всё время</span><b>${P.total}</b><span>Лучший уровень</span><b>${REC.lvl}</b><span>Сезонов за одну игру</span><b>${REC.seasons}</b><span>Больше всего монет</span><b>🪙 ${REC.coins}</b><span>Время в игре</span><b>${fmt(P.time)}</b></div>
 <h2>Достижения: ${n} из ${ACH.length}</h2>
 <div class="acs">${ACH.map(x=>`<div class="ac ${x[2]()?'on':''}">${x[2]()?x[0]:'🔒'} ${x[1]}</div>`).join('')}</div>
 <button onclick="menu()">Назад</button></div>`}
function menu(){
 const sv=SV?`<p class="sub">${SEA[SV.sn%4].e} ${SEA[SV.sn%4].n} · уровень ${1+Math.floor(SV.served/PER)} · 🪙 ${SV.coins}</p>`:'';
 $('ov').style.display='flex';
 $('ov').innerHTML=`<div><button class="chip" onclick="profile()">${P.av} ${esc(P.name)} <small>· ур. ${REC.lvl}</small></button>
 <h1>🥕 Ферма-экспресс</h1><p>Сажай овощи, собирай урожай и отдавай заказы, пока клиенты не ушли.</p>
 <p>Выполни план по заказам, чтобы наступил следующий сезон. Три ушедших клиента, и ферма закрывается.</p>${sv}
 ${SV?'<button onclick="start(true)">Продолжить</button><br><button class="alt" onclick="start()">Новая игра</button>':'<button onclick="start()">Играть</button>'}
 <br><button class="alt" onclick="profile()">Профиль и достижения</button></div>`}
function init(){S={coins:0,lives:3,inv:Object.fromEntries(Object.keys(CR).map(k=>[k,0])),plots:Array(4).fill(null),sel:'c',fert:0,cust:[],nid:1,spawn:1,served:0,time:0,sn:0,sg:0,msg:'',msgT:0}}
const mul=()=>Math.pow(.85,S.fert);
const plotCost=()=>40+40*(S.plots.length-4);
const fertCost=()=>60*(S.fert+1);
function say(t){S.msg=t;S.msgT=S.time+3}
function gen(){const pool=avail(),o={},L=lvl();
 const kinds=Math.random()<Math.min(.6,(L-1)*.15)?2:1;
 for(let i=0;i<kinds;i++){const k=pool[Math.floor(Math.random()*pool.length)];o[k]=1+Math.floor(Math.random()*(1+Math.min(2,Math.floor((L-1)/2))))}
 let n=0,v=0;for(const k in o){n+=o[k];v+=o[k]*CR[k].p}return{o,n,v}}
function addCust(){const g=gen(),pat=22+g.n*6;
 S.cust.push({id:S.nid++,f:FACES[Math.floor(Math.random()*FACES.length)],o:g.o,pat,left:pat,v:g.v})}
function newSeason(){
 S.sn++;S.sg=0;const cur=sea().cr;let got=0;
 for(const k in S.inv){if(!cur.includes(k)&&S.inv[k]){got+=Math.floor(S.inv[k]*CR[k].p*.5);S.inv[k]=0}}
 S.coins+=got;S.sel=avail()[0];sfx('season');
 for(const c of S.cust){const g=gen();c.o=g.o;c.v=g.v}
 say('✅ Сезон пройден! '+sea().e+' Наступила '+sea().n.toLowerCase()+(got?'. Старый урожай продан за '+got+' 🪙':''))}
function tick(dt){
 if(!run||S.paused)return;
 S.time+=dt;P.time+=dt;S.spawn-=dt;S.sv=(S.sv||0)+dt;if(S.sv>=2){S.sv=0;save()}
 const L=lvl();
 for(const p of S.plots)if(p&&!p.n&&ready(p)){p.n=1;sfx('ready')}
 if(S.spawn<=0&&S.cust.length<Math.min(4,1+L)){addCust();S.spawn=Math.max(3,8-(L-1)*.8)}
 for(const c of S.cust)c.left-=dt;
 const gone=S.cust.filter(c=>c.left<=0);
 if(gone.length){S.cust=S.cust.filter(c=>c.left>0);S.lives-=gone.length;sfx('bad');say('Клиент ушёл без покупки');if(S.lives<=0){S.lives=0;run=false;over()}}
 draw()
}
const ready=p=>p&&S.time-p.t0>=p.d;
const reward=c=>Math.round(c.v*1.5*(.7+.6*c.left/c.pat));
function draw(){
 const s=sea(),L=lvl();
 $('sw').textContent='⏱ '+fmt(S.time);
 const gr=S.plots.filter(p=>p&&!ready(p)),rd=S.plots.filter(p=>ready(p)).length;
 $('nh').textContent=(rd?'✅ Готово к сбору: '+rd:'')+(rd&&gr.length?' · ':'')+(gr.length?'⏱ Ближайший урожай через '+Math.ceil(Math.min(...gr.map(p=>p.d-(S.time-p.t0))))+' с':'')||'Нажми на пустую грядку, чтобы посадить';
 $('coins').innerHTML='🪙 '+S.coins+' <small>заказов: '+S.served+'</small>';
 $('lives').textContent='❤️'.repeat(S.lives)+'🖤'.repeat(3-S.lives);
 $('lvl').textContent='Уровень '+L+' · до следующего: '+(PER-S.served%PER);
 $('sea').textContent=s.e+' '+s.n+' · заказов '+S.sg+'/'+goal();
 $('xp').style.width=(S.served%PER)*100/PER+'%';
 $('sp').style.width=Math.min(100,S.sg*100/goal())+'%';
 $('field').style.setProperty('--sc',s.col);
 $('cust').innerHTML=S.cust.length?S.cust.map(c=>{
  const can=Object.keys(c.o).every(k=>S.inv[k]>=c.o[k]);
  return `<div class="c"><div class="r"><span class="face">${c.f}</span><div class="ord">${Object.keys(c.o).map(k=>`<span class="${S.inv[k]>=c.o[k]?'ok':''}">${CR[k].e}×${c.o[k]}</span>`).join('')}</div></div>
  <div class="bar"><i class="${c.left/c.pat<.3?'low':''}" style="width:${Math.max(0,c.left/c.pat*100)}%"></i></div>
  <button class="give" data-give="${c.id}" ${can?'':'disabled'}>Отдать +${reward(c)}</button></div>`}).join(''):'<div class="empty">Ждём покупателей…</div>';
 $('field').innerHTML=S.plots.map((p,i)=>{
  if(!p)return `<button class="p" data-plot="${i}" aria-label="Пустая грядка">＋</button>`;
  if(ready(p))return `<button class="p rd" data-plot="${i}" aria-label="Собрать урожай">${CR[p.k].e}<small>собрать</small></button>`;
  return `<button class="p g" data-plot="${i}" aria-label="Растёт">${CR[p.k].e}<small>${Math.ceil(p.d-(S.time-p.t0))} с</small><div class="bar"><i style="width:${(S.time-p.t0)/p.d*100}%"></i></div></button>`}).join('');
 $('seeds').innerHTML=s.cr.map((k,i)=>{
  if(i>=2&&L<UNL)return `<button class="seed" disabled><b>🔒</b><small>с уровня ${UNL}</small></button>`;
  return `<button class="seed ${S.sel===k?'on':''}" data-sel="${k}"><b>${CR[k].e}</b><small>${Math.round(CR[k].t*mul()*10)/10} с · 🪙${CR[k].p} · в запасе ${S.inv[k]}</small></button>`}).join('');
 const pc=plotCost(),fc=fertCost();
 $('shop').innerHTML=(S.plots.length<9?`<button class="buy" data-buy="plot" ${S.coins>=pc?'':'disabled'}>🟫 Новая грядка<small>🪙 ${pc}</small></button>`:`<button class="buy" disabled>🟫 Все грядки куплены</button>`)+
  (S.fert<5?`<button class="buy" data-buy="fert" ${S.coins>=fc?'':'disabled'}>🌱 Удобрение: рост быстрее на 15%<small>🪙 ${fc}</small></button>`:`<button class="buy" disabled>🌱 Удобрение: максимум</button>`);
 $('msg').textContent=S.time<S.msgT?S.msg:''
}
function isDark(){const r=document.documentElement;return (r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'}
function setDN(){$('dn').textContent=isDark()?'☀️':'🌙';$('dn').title=isDark()?'Включить день':'Включить ночь'}
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('button');if(!b||!run)return;const d=b.dataset;if(S.paused&&!d.t)return;ac();
 if(d.pause){S.paused=!S.paused;$('bp').textContent=S.paused?'▶️':'⏸';if(S.paused){S.msg='⏸ Пауза: игра остановлена';S.msgT=1e9}else S.msgT=0;draw();return}
 if(d.snd){SND=!SND;setSnd();save();sfx('tap');return}
 if(d.mus){MUS=!MUS;setSnd();save();return}
 if(d.menu){toMenu();return}
 if(d.dn){document.documentElement.dataset.theme=isDark()?'light':'dark';setDN();save();return}
 if(d.plot!==undefined){const i=+d.plot,p=S.plots[i];
  if(!p){S.plots[i]={k:S.sel,t0:S.time,d:CR[S.sel].t*mul()};sfx('plant')}
  else if(ready(p)){S.plots[i]=null;
   if(sea().cr.includes(p.k)){S.inv[p.k]++;sfx('harvest')}
   else{const g=Math.round(CR[p.k].p*.5);S.coins+=g;sfx('sell');say('Урожай не по сезону продан за '+g+' 🪙')}}}
 else if(d.sel){S.sel=d.sel;sfx('tap')}
 else if(d.give){const c=S.cust.find(x=>x.id==d.give);
  if(c&&Object.keys(c.o).every(k=>S.inv[k]>=c.o[k])){const old=lvl();
   for(const k in c.o)S.inv[k]-=c.o[k];
   const r=reward(c);S.coins+=r;S.served++;S.sg++;P.total++;S.cust=S.cust.filter(x=>x!==c);say('Продано! +'+r+' 🪙');sfx('sell');
   if(lvl()>old){const bn=20*lvl();S.coins+=bn;sfx('up');say('🎉 Уровень '+lvl()+'! Бонус +'+bn+' 🪙'+(lvl()===UNL?' · открыты новые семена':''))}
   if(S.sg>=goal()){const lu=lvl()>old,m=S.msg;newSeason();if(lu)S.msg=m+' · '+S.msg}}}
 else if(d.buy==='plot'&&S.coins>=plotCost()&&S.plots.length<9){S.coins-=plotCost();S.plots.push(null);sfx('buy')}
 else if(d.buy==='fert'&&S.coins>=fertCost()&&S.fert<5){S.coins-=fertCost();S.fert++;sfx('buy')}
 save();draw()
});
function start(c){if(c&&SV)S=SV;else{init();P.games++}SV=null;S.paused=false;if(S.msgT>1e8)S.msgT=0;$('bp').textContent='⏸';run=true;$('ov').style.display='none';save();draw()}
function over(){updRec();write(null);SV=null;const o=$('ov');o.style.display='flex';o.innerHTML=`<div><h1>Ферма закрыта</h1><p>Уровень: <b>${lvl()}</b> · заказов: <b>${S.served}</b></p><p>Время игры: <b>${fmt(S.time)}</b></p><p>Заработано: <b>🪙 ${S.coins}</b></p><p>🏆 Рекорды: уровень ${REC.lvl} · сезонов ${REC.seasons} · 🪙 ${REC.coins}</p><button onclick="start()">Играть ещё</button><br><button class="alt" onclick="menu()">В главное меню</button></div>`}
load();init();setDN();setSnd();menu();draw();
document.addEventListener('pointerdown',ac,{once:true});
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
let last=performance.now();
setInterval(()=>{const n=performance.now();tick(Math.min(.25,(n-last)/1000));last=n},100);
</script></body></html>

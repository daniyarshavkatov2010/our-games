<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кликер</title>
</head>
<body>
  <h1>Очки: <span id="score">0</span></h1>
  <button id="btn">Клик!</button>
  <p><a href="../../">← Ко всем играм</a></p>
  <script>
    let score = 0;
    document.getElementById("btn").onclick = () => {
      score++;
      document.getElementById("score").textContent = score;
    };
  </script>
</body>
</html>

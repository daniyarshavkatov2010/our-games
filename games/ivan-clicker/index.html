<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кликер</title>
<style>
  body { margin: 0; padding: 24px; background: #000; color: #f4f4f4; font-family: system-ui, "Segoe UI", sans-serif; text-align: center; }
  a { color: #4da3ff; }
  button { padding: 16px 40px; font-size: 1.4rem; font-weight: 700; border: 0; border-radius: 14px; background: #ffd23f; cursor: pointer; }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
  <p><a href="../../">← Ко всем играм</a></p>
  <h1>Очки: <span id="score">0</span></h1>
  <button id="btn">Клик!</button>
  <script>
    let score = 0;
    document.getElementById("btn").onclick = () => {
      score++;
      document.getElementById("score").textContent = score;
    };
  </script>
</body>
</html>
